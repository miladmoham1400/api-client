name: Publish verified pre-release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Native installer builds run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.18.0'
      - name: Validate successful native build provenance
        id: build
        shell: bash
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p dist/release
          gh api "repos/$REPOSITORY/actions/runs/$BUILD_RUN_ID" > dist/release/build-run.json
          gh api "repos/$REPOSITORY/actions/workflows/packages.yml" > dist/release/build-workflow.json
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const run = JSON.parse(readFileSync('dist/release/build-run.json', 'utf8'))
          const workflow = JSON.parse(readFileSync('dist/release/build-workflow.json', 'utf8'))
          if (run.conclusion !== 'success' || run.status !== 'completed' || run.workflow_id !== workflow.id || run.head_repository.full_name !== process.env.REPOSITORY || run.event !== 'workflow_dispatch' || !/^[a-f0-9]{40}$/.test(run.head_sha)) throw new Error('Build provenance is not an accepted native build')
          appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${run.head_sha}\n`)
          JS
          sha=$(node -p 'JSON.parse(require("fs").readFileSync("dist/release/build-run.json")).head_sha')
          gh api "repos/$REPOSITORY/contents/package.json?ref=$sha" --jq .content | base64 --decode > dist/release/build-package.json
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const version = JSON.parse(readFileSync('dist/release/build-package.json', 'utf8')).version
          const local = JSON.parse(readFileSync('package.json', 'utf8')).version
          if (version !== local || !/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Release version does not match native build')
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          JS
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: installers-*-${{ steps.build.outputs.source_sha }}
          path: dist/verified
      - name: Verify every installer checksum
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: node scripts/verify-release-artifacts.mjs dist/verified dist/release/assets "$VERSION"
      - name: Publish pre-release assets
        env:
          VERSION: ${{ steps.build.outputs.version }}
          SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
        shell: bash
        run: |
          gh release create "v$VERSION" dist/release/assets/*.deb dist/release/assets/*.AppImage dist/release/assets/*.exe dist/release/assets/SHA256SUMS.txt --target "$SOURCE_SHA" --prerelease --title "Offline API Client $VERSION" --notes-file "docs/releases/v$VERSION.md"
